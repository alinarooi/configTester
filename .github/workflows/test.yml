name: Test & Update Server List

on:
  schedule:
    # هر ۳ ساعت — طبق نیاز خودتان تغییر بدهید
    - cron: "0 */1 * * *"
  workflow_dispatch: {}

jobs:
  test-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug — list files
        run: |
          echo "--- آخرین کامیت ---"
          git log -1 --oneline
          echo "--- شاخه ---"
          git branch --show-current
          echo "--- کل فایل‌های .mjs در ریپو ---"
          find . -name "*.mjs" -not -path "./node_modules/*"
          echo "--- محتوای پوشه‌ی scripts (اگر وجود دارد) ---"
          ls -la scripts/ 2>&1 || echo "پوشه‌ی scripts در ریشه پیدا نشد!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Xray-core
        run: |
          curl -L -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip -d xray-bin
          chmod +x xray-bin/xray
          xray-bin/xray version

      - name: Run tester
        env:
          CF_ALL_URL: ${{ secrets.CF_ALL_URL }}
          CF_UPDATE_URL: ${{ secrets.CF_UPDATE_URL }}
          GH_RAW_URL: "GH_RAW_URL: https://raw.githubusercontent.com/barry-far/V2ray-Config/main/All_Configs_Sub.txt
          XRAY_BIN: ${{ github.workspace }}/xray-bin/xray
          MAX_CANDIDATES: "2000"
          CONCURRENCY: "60"
          MIN_KEEP_RATIO: "0.5"
          MAX_SSTP_CANDIDATES: "2000"
          SSTP_CONCURRENCY: "60"
          SSTP_DEBUG: "1"
        run: node scripts/test-and-update-servers.mjs
