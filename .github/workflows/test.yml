name: Config Tester

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download server list
        env:
          CF_ALL_URL: ${{ secrets.CF_ALL_URL }}
        run: |
          echo "Downloading server list..."

          curl -fL \
            --retry 3 \
            --connect-timeout 15 \
            "$CF_ALL_URL" \
            -o servers.txt

          echo "Download completed."

      - name: Check server list
        run: |
          echo "File size:"
          wc -c servers.txt

          echo "Number of lines:"
          wc -l servers.txt
